[general]
live_config_reload = true

# fish if installed, otherwise the login shell
[terminal.shell]
program = "/bin/sh"
args = ["-c", "exec \"$(command -v fish || echo \"${SHELL:-/bin/sh}\")\" -l"]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 8, y = 6 }
dynamic_padding = true
decorations = "Full"
opacity = 1.0

[scrolling]
history = 10000

[font]
size = 12.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "Off" }
vi_mode_style = { shape = "Beam" }

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# Tokyo Night
[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"
red = "#ff899d"
green = "#9fe044"
yellow = "#faba4a"
blue = "#8db0ff"
magenta = "#c7a9ff"
cyan = "#a4daff"
white = "#c0caf5"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"
